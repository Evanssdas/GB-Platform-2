name: Collect historical data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First delivery date YYYY-MM-DD
        required: true
        default: "2024-01-01"
      end_date:
        description: Last delivery date YYYY-MM-DD
        required: true
        default: "2024-03-31"
      collect_units:
        description: Collect delayed B1610 unit data
        required: true
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Collect Elexon core
        run: >-
          gb-v2 collect-elexon
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
          --output data/parsed/elexon
      - name: Collect Elexon unit generation
        if: inputs.collect_units
        run: >-
          gb-v2 collect-elexon-units
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
          --output data/parsed/elexon
      - name: Collect NESO embedded 2025
        if: startsWith(inputs.start_date, '2025') || startsWith(inputs.end_date, '2025')
        run: >-
          gb-v2 collect-neso-preset
          --name embedded_2025
          --output data/parsed/neso/embedded_2025.parquet
      - name: Collect NESO embedded 2026 H1
        if: startsWith(inputs.start_date, '2026') || startsWith(inputs.end_date, '2026')
        run: >-
          gb-v2 collect-neso-preset
          --name embedded_2026_h1
          --output data/parsed/neso/embedded_2026_h1.parquet
      - name: Collect NESO inertia
        run: >-
          gb-v2 collect-neso-preset
          --name inertia_2026_27
          --output data/parsed/neso/inertia_2026_27.parquet
      - name: Collect demand weather
        run: >-
          gb-v2 collect-weather --group demand
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
          --output data/parsed/weather/demand.parquet
      - name: Collect wind weather
        run: >-
          gb-v2 collect-weather --group wind
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
          --output data/parsed/weather/wind.parquet
      - name: Collect solar weather
        run: >-
          gb-v2 collect-weather --group solar
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
          --output data/parsed/weather/solar.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: gb-historical-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: data/parsed
          retention-days: 30
