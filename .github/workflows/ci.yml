name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src tests

      - name: Verify installed CLI
        run: |
          gb-v2 --help
          gb-v2 collect-elexon --help
          gb-v2 collect-neso-preset --help
          python -m gb_platform_v2.entsoe_cli --help

      - name: Test
        run: pytest -q

  synthetic-demo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run synthetic demonstration
        run: >-
          timeout 20m gb-v2 demo
          --days 90
          --scenarios 200
          --models models/demo
          --output outputs/demo

      - name: Upload demonstration outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-demo-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outputs/demo
          if-no-files-found: warn
          retention-days: 14
