name: Paper winter paired recovery
on:
  push:
    branches:
      - paper/matched-winter-grading-20261104
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  winter-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Reuse successfully fitted winter models (no retraining)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/winter
          gh run download 41742259102 --repo "$GITHUB_REPOSITORY" --name seasonal-winter_2025_26-41742259102 --dir inputs/winter
          find inputs/winter -name '*.csv'
      - name: Winter matched-period seasonal comparison
        run: |
          python -m gb_platform_v2.adaptive_analysis --v2r inputs/winter/v2r/daily_v2r_predictions.csv --lear inputs/winter/lear/rolling_lear_predictions.csv --output outputs/winter_recovery --publication-lag-minutes 120
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: winter-recovery-${{ github.run_id }}
          path: outputs/winter_recovery
          retention-days: 365
