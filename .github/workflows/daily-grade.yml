name: Daily APXMIDP grading V2
run-name: Grade APXMIDP ${{ inputs.delivery_date || 'previous GB day' }}

on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: GB delivery date to grade YYYY-MM-DD; leave blank for previous GB day
        required: false
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: daily-apxmidp-grading
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve GB delivery window
        id: dates
        shell: bash
        env:
          REQUESTED_DAY: ${{ inputs.delivery_date }}
          TZ: Europe/London
        run: |
          if [ -n "$REQUESTED_DAY" ]; then
            DAY="$REQUESTED_DAY"
          else
            DAY=$(date -d 'yesterday' +%F)
          fi
          python - "$DAY" <<'PY'
          import sys
          from datetime import date, timedelta

          day = date.fromisoformat(sys.argv[1])
          print(f"DAY={day}")
          print(f"END={day + timedelta(days=1)}")
          PY
          END=$(python - "$DAY" <<'PY'
          import sys
          from datetime import date, timedelta
          print(date.fromisoformat(sys.argv[1]) + timedelta(days=1))
          PY
          )
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Grading GB settlement date $DAY using [$DAY, $END)"

      - name: Collect actual prices
        run: >-
          timeout 10m gb-v2 collect-actuals
          --start "${{ steps.dates.outputs.day }}"
          --end "${{ steps.dates.outputs.end }}"
          --actuals live/actuals.csv
          --revision initial

      - name: Grade forecasts when forecast log exists
        shell: bash
        run: |
          if [ -s live/forecasts.csv ]; then
            gb-v2 grade \
              --forecasts live/forecasts.csv \
              --actuals live/actuals.csv \
              --scores live/scores.csv
          else
            echo "No forecast log yet; actuals were stored without grading."
          fi

      - name: Validate immutable output files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          actuals = Path("live/actuals.csv")
          if not actuals.exists() or actuals.stat().st_size == 0:
              raise SystemExit("No actual-price file was produced")
          frame = pd.read_csv(actuals)
          if frame.empty:
              raise SystemExit("Actual-price file is empty")
          print({"actual_rows": len(frame), "actual_columns": list(frame.columns)})
          scores = Path("live/scores.csv")
          if scores.exists():
              score_frame = pd.read_csv(scores)
              print({"score_rows": len(score_frame)})
          PY

      - name: Upload grading outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-grade-${{ steps.dates.outputs.day }}-run-${{ github.run_id }}
          path: |
            live/actuals.csv
            live/scores.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit immutable actuals and scores
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/actuals.csv
          [ ! -f live/scores.csv ] || git add live/scores.csv
          if git diff --cached --quiet; then
            echo "No new actuals or scores to commit"
            exit 0
          fi
          git commit -m "Grade APXMIDP ${{ steps.dates.outputs.day }}"
          git push
