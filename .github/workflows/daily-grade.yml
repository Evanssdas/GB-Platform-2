name: Daily APXMIDP grading V6
run-name: Grade and backfill all available shadow forecasts

on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: Latest GB delivery date to grade YYYY-MM-DD; blank means previous GB day
        required: false
      model_version:
        description: Shadow model version evaluated by the deployment gate
        required: true
        default: core-12m-operational-v1
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: daily-apxmidp-grading
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Discover missing actual-price history
        id: dates
        shell: bash
        env:
          REQUESTED_DAY: ${{ inputs.delivery_date }}
          TZ: Europe/London
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta
          from pathlib import Path
          import pandas as pd

          requested = os.environ.get("REQUESTED_DAY", "").strip()
          latest = date.fromisoformat(requested) if requested else date.today() - timedelta(days=1)
          forecast_path = Path("live/forecasts.csv")
          actual_path = Path("live/actuals.csv")

          forecast_days = []
          if forecast_path.exists():
              forecasts = pd.read_csv(forecast_path)
              times = pd.to_datetime(forecasts["delivery_time_utc"], utc=True)
              forecast_days = sorted(
                  day for day in times.dt.tz_convert("Europe/London").dt.date.unique() if day <= latest
              )

          actual_counts = {}
          if actual_path.exists():
              actuals = pd.read_csv(actual_path)
              times = pd.to_datetime(actuals["delivery_time_utc"], utc=True)
              local_days = times.dt.tz_convert("Europe/London").dt.date
              actual_counts = local_days.value_counts().to_dict()

          missing = []
          for day in forecast_days:
              start = pd.Timestamp(day).tz_localize("Europe/London").tz_convert("UTC")
              end = (pd.Timestamp(day) + pd.Timedelta(days=1)).tz_localize("Europe/London").tz_convert("UTC")
              expected = len(pd.date_range(start, end, freq="30min", inclusive="left"))
              if int(actual_counts.get(day, 0)) < expected:
                  missing.append(day)

          if missing:
              start = min(missing) - timedelta(days=1)
          else:
              start = latest - timedelta(days=1)
          end = latest + timedelta(days=1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"latest={latest.isoformat()}\n")
              handle.write(f"start={start.isoformat()}\n")
              handle.write(f"end={end.isoformat()}\n")
              handle.write(f"forecast_days={len(forecast_days)}\n")
              handle.write(f"missing_days={len(missing)}\n")
          print({
              "latest_delivery_day": latest.isoformat(),
              "stored_forecast_days": len(forecast_days),
              "days_missing_actuals": [day.isoformat() for day in missing],
              "collection_window": [start.isoformat(), end.isoformat()],
          })
          PY

      - name: Collect missing target and persistence actuals
        run: >-
          timeout 20m gb-v2 collect-actuals
          --start "${{ steps.dates.outputs.start }}"
          --end "${{ steps.dates.outputs.end }}"
          --actuals live/actuals.csv
          --revision initial

      - name: Regrade every stored forecast with available actuals
        shell: bash
        run: |
          if [ -s live/forecasts.csv ]; then
            gb-v2 grade \
              --forecasts live/forecasts.csv \
              --actuals live/actuals.csv \
              --scores live/scores.csv
          else
            echo "No permanent forecast history exists yet."
          fi

      - name: Evaluate objective deployment gate
        env:
          MODEL_VERSION: ${{ inputs.model_version || 'core-12m-operational-v1' }}
        run: >-
          python -m gb_platform_v2.deployment_gate
          --scores live/scores.csv
          --model-version "$MODEL_VERSION"
          --output live/deployment_gate.json
          --min-days 30
          --min-improvement-percent 5
          --coverage-min 0.70
          --coverage-max 0.90
          --min-lead-hours 8

      - name: Register every graded delivery day in review history
        env:
          MODEL_VERSION: ${{ inputs.model_version || 'core-12m-operational-v1' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          from gb_platform_v2.review_logs import register_grading

          scores_path = Path("live/scores.csv")
          if not scores_path.exists() or scores_path.stat().st_size == 0:
              print("No scores available for review registration")
              raise SystemExit(0)

          scores = pd.read_csv(scores_path)
          scores["delivery_time_utc"] = pd.to_datetime(scores["delivery_time_utc"], utc=True)
          scores["delivery_date_local"] = (
              scores["delivery_time_utc"].dt.tz_convert("Europe/London").dt.date.astype(str)
          )
          selected = scores.loc[scores["model_version"].astype(str).eq(os.environ["MODEL_VERSION"])]
          dates = sorted(selected["delivery_date_local"].dropna().unique())
          for delivery in dates:
              register_grading(
                  "logs",
                  "live/actuals.csv",
                  "live/scores.csv",
                  "live/deployment_gate.json",
                  os.environ["MODEL_VERSION"],
                  str(delivery),
                  os.environ["RUN_ID"],
                  os.environ["RUN_ATTEMPT"],
                  "initial",
              )
          print({"registered_delivery_days": dates})
          PY

      - name: Refresh permanent forecast history index
        run: python -m gb_platform_v2.history_index --logs-root logs

      - name: Validate complete historical grading state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          required = [
              Path("live/actuals.csv"),
              Path("live/deployment_gate.json"),
              Path("logs/daily/README.md"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f"Missing grading-history outputs: {missing}")

          gate = json.loads(Path("live/deployment_gate.json").read_text())
          scores = pd.read_csv("live/scores.csv") if Path("live/scores.csv").exists() else pd.DataFrame()
          summary = pd.read_csv("logs/daily_summary.csv") if Path("logs/daily_summary.csv").exists() else pd.DataFrame()
          print({
              "score_rows": len(scores),
              "history_days": len(summary),
              "deployment_ready": gate.get("deployment_ready"),
              "gate_metrics": gate.get("metrics", {}),
          })
          PY

      - name: Upload complete grading history
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-grade-history-run-${{ github.run_id }}
          path: |
            live/forecasts.csv
            live/actuals.csv
            live/scores.csv
            live/deployment_gate.json
            logs
          if-no-files-found: warn
          retention-days: 365

      - name: Commit actuals scores gate and complete history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/actuals.csv live/deployment_gate.json logs
          [ ! -f live/scores.csv ] || git add live/scores.csv
          if ! git diff --cached --quiet; then
            git commit -m "Backfill daily APXMIDP grading history through ${{ steps.dates.outputs.latest }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Historical grading is already current"
          fi
