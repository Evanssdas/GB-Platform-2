name: Daily APXMIDP grading

on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: Delivery date to grade YYYY-MM-DD
        required: true
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Resolve delivery window
        id: dates
        shell: bash
        run: |
          if [ -n "${{ inputs.delivery_date }}" ]; then
            DAY="${{ inputs.delivery_date }}"
          else
            DAY=$(date -u -d 'yesterday' +%F)
          fi
          END=$(date -u -d "$DAY + 1 day" +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
      - name: Collect actual prices
        run: >-
          gb-v2 collect-actuals
          --start "${{ steps.dates.outputs.day }}"
          --end "${{ steps.dates.outputs.end }}"
          --actuals live/actuals.csv
          --revision initial
      - name: Grade forecasts when forecast log exists
        shell: bash
        run: |
          if [ -f live/forecasts.csv ]; then
            gb-v2 grade \
              --forecasts live/forecasts.csv \
              --actuals live/actuals.csv \
              --scores live/scores.csv
          else
            echo "No forecast log yet; actuals were stored without grading."
          fi
      - name: Commit immutable actuals and scores
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/actuals.csv
          [ ! -f live/scores.csv ] || git add live/scores.csv
          git diff --cached --quiet || git commit -m "Grade APXMIDP ${{ steps.dates.outputs.day }}"
          git push
