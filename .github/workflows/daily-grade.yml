name: Daily APXMIDP grading V5
run-name: Grade APXMIDP ${{ inputs.delivery_date || 'previous GB day' }}

on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: GB delivery date to grade YYYY-MM-DD; leave blank for previous GB day
        required: false
      model_version:
        description: Shadow model version evaluated by the deployment gate
        required: true
        default: core-12m-operational-v1
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: daily-apxmidp-grading
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Resolve GB delivery and persistence windows
        id: dates
        shell: bash
        env:
          REQUESTED_DAY: ${{ inputs.delivery_date }}
          TZ: Europe/London
        run: |
          if [ -n "$REQUESTED_DAY" ]; then
            DAY="$REQUESTED_DAY"
          else
            DAY=$(date -d 'yesterday' +%F)
          fi
          read -r START END <<EOF
          $(python - "$DAY" <<'PY'
          import sys
          from datetime import date, timedelta
          day = date.fromisoformat(sys.argv[1])
          print(day - timedelta(days=1), day + timedelta(days=1))
          PY
          )
          EOF
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Grading GB settlement date $DAY and collecting persistence source window [$START, $END)"

      - name: Collect target and prior-day actual prices
        run: >-
          timeout 10m gb-v2 collect-actuals
          --start "${{ steps.dates.outputs.start }}"
          --end "${{ steps.dates.outputs.end }}"
          --actuals live/actuals.csv
          --revision initial

      - name: Grade immutable forecasts
        shell: bash
        run: |
          if [ -s live/forecasts.csv ]; then
            gb-v2 grade \
              --forecasts live/forecasts.csv \
              --actuals live/actuals.csv \
              --scores live/scores.csv
          else
            echo "No forecast log yet; actuals were stored without grading."
          fi

      - name: Evaluate objective deployment gate
        env:
          MODEL_VERSION: ${{ inputs.model_version || 'core-12m-operational-v1' }}
        run: >-
          python -m gb_platform_v2.deployment_gate
          --scores live/scores.csv
          --model-version "$MODEL_VERSION"
          --output live/deployment_gate.json
          --min-days 30
          --min-improvement-percent 5
          --coverage-min 0.70
          --coverage-max 0.90
          --min-lead-hours 8

      - name: Register grading in unified review logs
        run: >-
          python -m gb_platform_v2.review_logs grading
          --logs-root logs
          --actuals live/actuals.csv
          --scores live/scores.csv
          --deployment-gate live/deployment_gate.json
          --model-version "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          --delivery-date "${{ steps.dates.outputs.day }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --actual-revision initial

      - name: Validate immutable output files and fair persistence comparison
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          actuals = Path("live/actuals.csv")
          if not actuals.exists() or actuals.stat().st_size == 0:
              raise SystemExit("No actual-price file was produced")
          frame = pd.read_csv(actuals)
          if frame.empty:
              raise SystemExit("Actual-price file is empty")
          gate = json.loads(Path("live/deployment_gate.json").read_text())
          summary = pd.read_csv("logs/daily_summary.csv")
          delivery = "${{ steps.dates.outputs.day }}"
          review_rows = summary.loc[summary["delivery_date"].astype(str).eq(delivery)]
          if review_rows.empty:
              raise SystemExit("Unified review log does not contain the graded delivery date")
          if not Path("logs/README.md").exists():
              raise SystemExit("Review-log dashboard is missing")

          metrics = gate.get("metrics", {})
          graded = int(metrics.get("graded_periods") or 0)
          comparable = int(metrics.get("comparable_persistence_periods") or 0)
          if graded and comparable != graded:
              print(f"::warning::Persistence comparison covers {comparable}/{graded} periods; MAE gate remains provisional.")

          print({
              "actual_rows": len(frame),
              "deployment_ready": gate["deployment_ready"],
              "gate_mode": gate["mode"],
              "graded_periods": graded,
              "comparable_persistence_periods": comparable,
              "review_rows_for_day": len(review_rows),
          })
          scores = Path("live/scores.csv")
          if scores.exists():
              print({"score_rows": len(pd.read_csv(scores))})
          PY

      - name: Upload grading gate and review evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-grade-${{ steps.dates.outputs.day }}-run-${{ github.run_id }}
          path: |
            live/actuals.csv
            live/scores.csv
            live/deployment_gate.json
            logs
          if-no-files-found: warn
          retention-days: 90

      - name: Commit immutable actuals scores gate and review logs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/actuals.csv live/deployment_gate.json logs
          [ ! -f live/scores.csv ] || git add live/scores.csv
          if ! git diff --cached --quiet; then
            git commit -m "Grade APXMIDP ${{ steps.dates.outputs.day }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new actuals scores gate or review state to commit"
          fi
