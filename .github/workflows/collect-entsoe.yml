name: Collect ENTSO-E neighbours

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: UTC start, e.g. 2026-07-01T00:00Z
        required: true
        default: "2026-07-01T00:00Z"
      end_utc:
        description: UTC exclusive end
        required: true
        default: "2026-07-02T00:00Z"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Check secret is configured
        shell: bash
        run: |
          if [ -z "$ENTSOE_TOKEN" ]; then
            echo "ENTSOE_TOKEN repository secret is missing"
            exit 1
          fi
          echo "ENTSOE_TOKEN is configured"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Collect ENTSO-E products
        id: collect_entsoe
        continue-on-error: true
        run: >-
          python -m gb_platform_v2.entsoe_cli
          --config config/entsoe.yaml
          --start "${{ inputs.start_utc }}"
          --end "${{ inputs.end_utc }}"
          --output data/parsed/entsoe
      - name: Summarise without exposing credentials
        if: always()
        shell: bash
        run: |
          if [ -d data/parsed/entsoe ]; then
            find data/parsed/entsoe -maxdepth 1 -type f -printf '%f %s bytes\n'
          else
            echo "No ENTSO-E output directory was created"
          fi
      - name: Upload ENTSO-E data and status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: entsoe-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: data/parsed/entsoe
          if-no-files-found: warn
          retention-days: 30
      - name: Fail job when no usable ENTSO-E data were collected
        if: steps.collect_entsoe.outcome == 'failure'
        shell: bash
        run: |
          echo "ENTSO-E collection produced no usable datasets. Download collection_status.json from the artifact for safe diagnostics."
          exit 1
