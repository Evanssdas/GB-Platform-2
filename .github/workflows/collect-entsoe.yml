name: Collect ENTSO-E neighbours

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: UTC start, e.g. 2026-07-01T00:00Z
        required: true
        default: "2026-07-01T00:00Z"
      end_utc:
        description: UTC exclusive end
        required: true
        default: "2026-07-02T00:00Z"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check secret is configured
        shell: bash
        run: |
          if [ -z "$ENTSOE_TOKEN" ]; then
            echo "ENTSOE_TOKEN repository secret is missing"
            exit 1
          fi
          echo "ENTSOE_TOKEN is configured"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Collect ENTSO-E products
        run: >-
          python -m gb_platform_v2.entsoe_cli
          --config config/entsoe.yaml
          --start "${{ inputs.start_utc }}"
          --end "${{ inputs.end_utc }}"
          --output data/parsed/entsoe
      - name: Summarise without exposing credentials
        shell: bash
        run: |
          find data/parsed/entsoe -maxdepth 1 -type f -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: entsoe-${{ inputs.start_utc }}-${{ inputs.end_utc }}
          path: data/parsed/entsoe
          retention-days: 30
