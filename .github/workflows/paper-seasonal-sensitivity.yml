name: Paper two-window seasonal sensitivity
on:
  push:
    branches:
      - paper/seasonal-rolling-origin-20261103
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  seasonal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: winter_2025_26
            start: "2025-11-15"
            end: "2026-02-28"
          - label: spring_summer_2026
            start: "2026-03-01"
            end: "2026-06-30"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download archived point-in-time dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh run download 41244609403 --repo "$GITHUB_REPOSITORY" --name final-paper-v2r-analysis-41244609403 --dir inputs
      - name: Refit V2-R daily with publication allowance
        run: |
          python -m gb_platform_v2.rolling_v2r --dataset inputs/data/processed/gb_half_hourly_v2r.parquet --output outputs/v2r --start ${{ matrix.start }} --end ${{ matrix.end }} --publication-lag-minutes 120
      - name: Refit pooled LEAR-style daily
        run: |
          python -m gb_platform_v2.rolling_lear --dataset inputs/data/processed/gb_half_hourly_v2r.parquet --output outputs/lear --start ${{ matrix.start }} --end ${{ matrix.end }} --publication-lag-minutes 120
      - name: Evaluate adaptive and benchmarks on matching rows
        run: |
          python -m gb_platform_v2.adaptive_analysis --v2r outputs/v2r/daily_v2r_predictions.csv --lear outputs/lear/rolling_lear_predictions.csv --output outputs/adaptive --publication-lag-minutes 120
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: seasonal-${{ matrix.label }}-${{ github.run_id }}
          path: outputs
          retention-days: 365
