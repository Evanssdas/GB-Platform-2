name: Shadow day-ahead forecast V4
run-name: Shadow forecast ${{ inputs.delivery_date || 'next GB day' }}

on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: Optional GB delivery date YYYY-MM-DD; blank means tomorrow
        required: false
        default: ""
      release_tag:
        description: Frozen operational model release
        required: true
        default: operational-core-v1
      model_version:
        description: Immutable model version
        required: true
        default: core-12m-operational-v1
      scenarios:
        description: Monte Carlo scenarios
        required: true
        default: "1000"
  schedule:
    - cron: "50 11 * * *"
    - cron: "50 12 * * *"

permissions:
  contents: write

concurrency:
  group: shadow-day-ahead
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      MPLBACKEND: Agg
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve issue and delivery times
        id: dates
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.delivery_date }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo("Europe/London"))
          manual = os.environ.get("MANUAL_DATE", "").strip()
          proceed = True
          if os.environ["EVENT_NAME"] == "schedule":
              offset_hours = int(local.utcoffset().total_seconds() // 3600)
              expected_utc_hour = 12 - offset_hours
              scheduled_hour = int(os.environ.get("EVENT_SCHEDULE", "0 0 * * *").split()[1])
              proceed = scheduled_hour == expected_utc_hour
          delivery = manual or (local.date() + timedelta(days=1)).isoformat()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"proceed={str(proceed).lower()}\n")
              handle.write(f"delivery_date={delivery}\n")
              handle.write(f"issue_time_utc={now.isoformat()}\n")
          print({"proceed": proceed, "delivery_date": delivery, "issue_time_utc": now.isoformat()})
          PY

      - name: Install and test
        if: steps.dates.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Download frozen operational model release
        if: steps.dates.outputs.proceed == 'true'
        env:
          TAG: ${{ inputs.release_tag || 'operational-core-v1' }}
        run: |
          mkdir -p operational_bundle
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern operational-core-v1.zip --dir operational_bundle
          unzip -q operational_bundle/operational-core-v1.zip -d operational_bundle/unpacked
          test -f operational_bundle/unpacked/models/metadata.json
          test -f operational_bundle/unpacked/models/operational_component_errors.parquet

      - name: Build leakage-safe tomorrow features
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          timeout 20m python -m gb_platform_v2.shadow_features
          --delivery-date "${{ steps.dates.outputs.delivery_date }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --config config/example.yaml
          --models operational_bundle/unpacked/models
          --output data/processed/shadow_features.parquet
          --recent-dir data/parsed/shadow_recent
          --summary outputs/shadow/feature_summary.json

      - name: Run and immutably log shadow forecast
        if: steps.dates.outputs.proceed == 'true'
        shell: bash
        env:
          MODEL_VERSION: ${{ inputs.model_version || 'core-12m-operational-v1' }}
          ISSUE_TIME_UTC: ${{ steps.dates.outputs.issue_time_utc }}
          SCENARIOS: ${{ inputs.scenarios || '1000' }}
        run: |
          set -Eeuo pipefail
          mkdir -p outputs/shadow
          rm -rf outputs/shadow/forecast

          run_forecast() {
            timeout 40m python -m gb_platform_v2.cli live-forecast \
              --input data/processed/shadow_features.parquet \
              --models operational_bundle/unpacked/models \
              --output outputs/shadow/forecast \
              --forecasts live/forecasts.csv \
              --model-version "$MODEL_VERSION" \
              --issue-time-utc "$ISSUE_TIME_UTC" \
              --scenarios "$SCENARIOS"
          }

          if ! run_forecast 2>&1 | tee outputs/shadow/live_forecast.log; then
            echo "::warning::Shadow forecast attempt failed; cleaning outputs and retrying once."
            rm -rf outputs/shadow/forecast
            sleep 5
            run_forecast 2>&1 | tee -a outputs/shadow/live_forecast.log
          fi

          test -s outputs/shadow/forecast/half_hourly_price_forecast.csv
          test -s outputs/shadow/forecast/half_hourly_system_forecast.csv
          test -s outputs/shadow/forecast/daily_report.json
          test -s outputs/shadow/forecast/price_fan_chart.png
          test -s live/forecasts.csv

      - name: Publish permanent daily VaR and risk report
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          python -m gb_platform_v2.shadow_reporting
          --daily-report outputs/shadow/forecast/daily_report.json
          --feature-summary outputs/shadow/feature_summary.json
          --reports-root live/reports
          --risk-log live/risk_log.csv
          --model-version "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --delivery-date "${{ steps.dates.outputs.delivery_date }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --scenarios "${{ inputs.scenarios || '1000' }}"

      - name: Register forecast in unified review logs
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          python -m gb_platform_v2.review_logs forecast
          --logs-root logs
          --daily-report outputs/shadow/forecast/daily_report.json
          --feature-summary outputs/shadow/feature_summary.json
          --price-forecast outputs/shadow/forecast/half_hourly_price_forecast.csv
          --system-forecast outputs/shadow/forecast/half_hourly_system_forecast.csv
          --model-version "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          --delivery-date "${{ steps.dates.outputs.delivery_date }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --scenarios "${{ inputs.scenarios || '1000' }}"

      - name: Build full market report
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          python -m gb_platform_v2.market_report
          --system-forecast outputs/shadow/forecast/half_hourly_system_forecast.csv
          --price-forecast outputs/shadow/forecast/half_hourly_price_forecast.csv
          --daily-report outputs/shadow/forecast/daily_report.json
          --feature-summary outputs/shadow/feature_summary.json
          --output-dir "logs/daily/${{ steps.dates.outputs.delivery_date }}/market-report-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          --model-version "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          --delivery-date "${{ steps.dates.outputs.delivery_date }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --scenarios "${{ inputs.scenarios || '1000' }}"
          --paper-capital-gbp 500000
          --var-budget-fraction 0.02
          --reference-position-mwh 100
          --confidence-level 0.95

      - name: Validate complete report
        if: steps.dates.outputs.proceed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          delivery = "${{ steps.dates.outputs.delivery_date }}"
          root = Path(f"logs/daily/{delivery}/market-report-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}")
          required = [
              root / "report.md",
              root / "report.json",
              root / "half_hourly_system_and_price_table.csv",
              root / "daily_system_summary.csv",
              root / "var_and_position_limits.csv",
              root / "plots/01_system_components.png",
              root / "plots/02_residual_demand.png",
              root / "plots/03_wind_solar_breakdown.png",
              root / "plots/04_net_imports_and_inertia.png",
              root / "plots/05_price_fan.png",
              root / "plots/06_negative_price_probability.png",
              root / "plots/07_risk_position_limits.png",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f"Complete market report is missing files: {missing}")
          limits = pd.read_csv(root / "var_and_position_limits.csv")
          binding = limits.loc[limits["metric"].eq("Binding maximum permissible volume"), "value"]
          if binding.empty or float(binding.iloc[0]) <= 0:
              raise SystemExit("Maximum permissible volume was not calculated")
          print({"report": str(root / "report.md"), "binding_maximum_volume_mwh": float(binding.iloc[0])})
          PY

      - name: Commit forecast risk review and market reports
        if: steps.dates.outputs.proceed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/forecasts.csv live/risk_log.csv live/reports logs
          if ! git diff --cached --quiet; then
            git commit -m "Shadow forecast and market report ${{ steps.dates.outputs.delivery_date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload forecast and market-report evidence
        if: always() && steps.dates.outputs.proceed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: shadow-forecast-${{ steps.dates.outputs.delivery_date }}-run-${{ github.run_id }}
          path: |
            data/processed/shadow_features.parquet
            outputs/shadow
            live/risk_log.csv
            live/reports/${{ steps.dates.outputs.delivery_date }}
            logs
          if-no-files-found: warn
          retention-days: 90
