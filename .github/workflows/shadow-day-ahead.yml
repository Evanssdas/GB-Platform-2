name: Shadow day-ahead forecast V3
run-name: Shadow forecast ${{ inputs.delivery_date || 'next GB day' }}

on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: Optional GB delivery date YYYY-MM-DD; blank means tomorrow
        required: false
        default: ""
      release_tag:
        description: Frozen operational model release
        required: true
        default: operational-core-v1
      model_version:
        description: Immutable model version
        required: true
        default: core-12m-operational-v1
      scenarios:
        description: Monte Carlo scenarios
        required: true
        default: "1000"
  schedule:
    - cron: "50 11 * * *"
    - cron: "50 12 * * *"

permissions:
  contents: write

concurrency:
  group: shadow-day-ahead
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve issue and delivery times
        id: dates
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.delivery_date }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          london = ZoneInfo("Europe/London")
          local = now.astimezone(london)
          manual = os.environ.get("MANUAL_DATE", "").strip()
          proceed = True
          if os.environ["EVENT_NAME"] == "schedule":
              offset_hours = int(local.utcoffset().total_seconds() // 3600)
              expected_utc_hour = 12 - offset_hours
              scheduled_hour = int(os.environ.get("EVENT_SCHEDULE", "0 0 * * *").split()[1])
              proceed = scheduled_hour == expected_utc_hour
          delivery = manual or (local.date() + timedelta(days=1)).isoformat()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"proceed={str(proceed).lower()}\n")
              handle.write(f"delivery_date={delivery}\n")
              handle.write(f"issue_time_utc={now.isoformat()}\n")
          print({
              "proceed": proceed,
              "delivery_date": delivery,
              "issue_time_utc": now.isoformat(),
              "actual_local_time": local.isoformat(),
              "event_schedule": os.environ.get("EVENT_SCHEDULE"),
          })
          PY

      - name: Install and test
        if: steps.dates.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

      - name: Download frozen operational model release
        if: steps.dates.outputs.proceed == 'true'
        env:
          TAG: ${{ inputs.release_tag || 'operational-core-v1' }}
        run: |
          mkdir -p operational_bundle
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern operational-core-v1.zip \
            --dir operational_bundle
          unzip -q operational_bundle/operational-core-v1.zip -d operational_bundle/unpacked
          test -f operational_bundle/unpacked/models/metadata.json
          test -f operational_bundle/unpacked/models/operational_component_errors.parquet

      - name: Build leakage-safe tomorrow features
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          timeout 20m python -m gb_platform_v2.shadow_features
          --delivery-date "${{ steps.dates.outputs.delivery_date }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --config config/example.yaml
          --models operational_bundle/unpacked/models
          --output data/processed/shadow_features.parquet
          --recent-dir data/parsed/shadow_recent
          --summary outputs/shadow/feature_summary.json

      - name: Run and immutably log shadow forecast
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          timeout 35m gb-v2 live-forecast
          --input data/processed/shadow_features.parquet
          --models operational_bundle/unpacked/models
          --output outputs/shadow/forecast
          --forecasts live/forecasts.csv
          --model-version "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --scenarios "${{ inputs.scenarios || '1000' }}"

      - name: Publish permanent daily VaR and risk report
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          python -m gb_platform_v2.shadow_reporting
          --daily-report outputs/shadow/forecast/daily_report.json
          --feature-summary outputs/shadow/feature_summary.json
          --reports-root live/reports
          --risk-log live/risk_log.csv
          --model-version "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --delivery-date "${{ steps.dates.outputs.delivery_date }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --scenarios "${{ inputs.scenarios || '1000' }}"

      - name: Register forecast in unified review logs
        if: steps.dates.outputs.proceed == 'true'
        run: >-
          python -m gb_platform_v2.review_logs forecast
          --logs-root logs
          --daily-report outputs/shadow/forecast/daily_report.json
          --feature-summary outputs/shadow/feature_summary.json
          --price-forecast outputs/shadow/forecast/half_hourly_price_forecast.csv
          --system-forecast outputs/shadow/forecast/half_hourly_system_forecast.csv
          --model-version "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          --delivery-date "${{ steps.dates.outputs.delivery_date }}"
          --issue-time-utc "${{ steps.dates.outputs.issue_time_utc }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --scenarios "${{ inputs.scenarios || '1000' }}"

      - name: Validate shadow output
        if: steps.dates.outputs.proceed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          features = json.loads(Path("outputs/shadow/feature_summary.json").read_text())
          forecast = pd.read_csv("outputs/shadow/forecast/half_hourly_price_forecast.csv")
          store = pd.read_csv("live/forecasts.csv")
          risk_log = pd.read_csv("live/risk_log.csv")
          review = pd.read_csv("logs/daily_summary.csv")
          expected = int(features["expected_period_count"])
          if len(forecast) != expected:
              raise SystemExit(f"Forecast rows {len(forecast)} != expected {expected}")
          version = "${{ inputs.model_version || 'core-12m-operational-v1' }}"
          delivery = "${{ steps.dates.outputs.delivery_date }}"
          selected = store.loc[
              store["model_version"].astype(str).eq(version)
              & pd.to_datetime(store["delivery_time_utc"], utc=True).dt.tz_convert("Europe/London").dt.date.astype(str).eq(delivery)
          ]
          if len(selected) < expected:
              raise SystemExit("Immutable forecast store does not contain the complete delivery day")
          risk_rows = risk_log.loc[
              risk_log["model_version"].astype(str).eq(version)
              & risk_log["delivery_date"].astype(str).eq(delivery)
          ]
          if risk_rows.empty:
              raise SystemExit("Permanent risk log does not contain this delivery day")
          review_rows = review.loc[review["delivery_date"].astype(str).eq(delivery)]
          if review_rows.empty or review_rows["scenario_var_gbp"].isna().all():
              raise SystemExit("Unified review log does not contain the forecast and VaR")
          report_path = Path(str(risk_rows.iloc[-1]["report_path"]))
          if not report_path.exists():
              raise SystemExit(f"Permanent daily report is missing: {report_path}")
          if not Path("logs/README.md").exists():
              raise SystemExit("Review-log dashboard is missing")
          print({
              "forecast_rows": len(forecast),
              "stored_rows_for_day": len(selected),
              "risk_log_rows_for_day": len(risk_rows),
              "review_log_rows_for_day": len(review_rows),
              "daily_report": str(report_path),
              "delivery_date": delivery,
          })
          PY

      - name: Commit immutable forecast risk and review logs
        if: steps.dates.outputs.proceed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/forecasts.csv live/risk_log.csv live/reports logs
          if ! git diff --cached --quiet; then
            git commit -m "Shadow forecast ${{ steps.dates.outputs.delivery_date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new immutable forecast risk or review rows"
          fi

      - name: Upload shadow forecast evidence
        if: always() && steps.dates.outputs.proceed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: shadow-forecast-${{ steps.dates.outputs.delivery_date }}-run-${{ github.run_id }}
          path: |
            data/processed/shadow_features.parquet
            outputs/shadow
            live/risk_log.csv
            live/reports/${{ steps.dates.outputs.delivery_date }}
            logs
          if-no-files-found: warn
          retention-days: 90
